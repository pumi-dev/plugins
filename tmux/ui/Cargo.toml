[package]
name = "tmux"
version = "0.1.0"
edition = "2024"
publish = false
description = "tmux on pumi (docs/v2/23 §3, step 5): tmux's language over the model, provided to every caller from the app."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
pumi-plugin = { workspace = true }
serde_json = { workspace = true }
# pumi's crates, by path from a pumi checkout beside this one. They must build for
# wasm32-wasip2: pumi-api without its unix-socket `channel` module and with its link-time
# table (`linkme`, which has no wasm support) behind a cfg, pumi-lang with its libc calls
# (fnmatch, strftime, localtime_r, getpwnam) behind a cfg or replaced. pumi-mirror is not used:
# its `Kernel` holds a socket connection, so `src/kernel` is a copy of it over `api::call`;
# pumi-proto (unix sockets) and pumi-keys (libghostty) are not used either.
pumi-api = { path = "../../../pumi/crates/pumi-api" }
pumi-lang = { path = "../../../pumi/crates/pumi-lang" }
pumi-layout = { path = "../../../pumi/crates/pumi-layout" }
schemars = "=1.2.3"
serde = { version = "=1.0.229", features = ["derive"] }
regex = "=1.13.1"
