[package]
name = "image-preview"
version = "0.1.0"
edition = "2024"
publish = false
description = "Rest the pointer on an image file's path in a terminal to see the image."

# A plugin: a WebAssembly component on pumi-plugin
# (`cargo build --release --target wasm32-wasip2`). A debug build of the app finds it in
# this checkout's `plugins/`; an installed app looks in
# `~/.config/pumi/extensions/image-preview`.
[lib]
crate-type = ["cdylib"]

[dependencies]
pumi-plugin = { path = "../../crates/pumi-plugin" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
