[package]
name = "image-preview"
version = "0.1.0"
edition = "2024"
publish = false
license = "GPL-3.0-or-later"
description = "Rest the pointer on an image file's path in a terminal to see the image."

# A cdylib, built as `cargo build --release --target wasm32-wasip2`; not a workspace member (see
# README.md).
[lib]
crate-type = ["cdylib"]

[dependencies]
pumi-plugin = { path = "../pumi/crates/pumi-plugin" }
