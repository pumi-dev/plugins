<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="-apple-system, BlinkMacSystemFont, Inter, sans-serif">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#efece6"/>
      <stop offset="1" stop-color="#e2ded6"/>
    </linearGradient>
    <filter id="card" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.10"/>
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="960" height="600" rx="12" fill="url(#wall)"/>

  <!-- the sidebar -->
  <path d="M0 12A12 12 0 0 1 12 0h188v600H12A12 12 0 0 1 0 588z" fill="#f2f0ec"/>
  <circle cx="20" cy="20" r="5" fill="#f26a5e"/>
  <circle cx="38" cy="20" r="5" fill="#f5bd4f"/>
  <circle cx="56" cy="20" r="5" fill="#61c554"/>
  <g fill="none" stroke="#6c6973" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M86 20h-6M82 16l-4 4 4 4"/>
    <path d="M98 20h6M102 16l4 4-4 4"/>
    <path d="M118 16a4.4 4.4 0 1 1-1.2 8.4M122 24v3"/>
    <path d="M158 20h8M162 16v8"/>
    <g stroke-width="2"><path d="M176 18h.1M180 18h.1M184 18h.1"/></g>
  </g>
  <rect x="170" y="12" width="14" height="14" rx="3" fill="none" stroke="#9c99a3" stroke-width="1.4"/>

  <!-- the address pill -->
  <rect x="10" y="40" width="168" height="30" rx="11" fill="#fff" stroke="#e2ded6"/>
  <rect x="16" y="46" width="18" height="18" rx="5" fill="#dce6f5"/>
  <text x="25" y="59" font-size="10" font-weight="600" fill="#3d86d6" text-anchor="middle">H</text>
  <text x="41" y="59" font-size="11.5" font-weight="500" fill="#2b2931">howtogeek.com</text>
  <path d="M164 50v7" stroke="#9c99a3" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M161 47.6h6l-1 2.6h-4z" fill="#9c99a3"/>

  <!-- its row of buttons -->
  <path d="M19 92v7M16 89.6h6l-1 2.6h-4z" fill="#8e8b95" stroke="#8e8b95" stroke-width="1.2"/>
  <rect x="34" y="84" width="20" height="20" rx="6" fill="#eae6f8"/>
  <text x="44" y="98" font-size="9.5" font-weight="700" fill="#6f5cf0" text-anchor="middle">A</text>
  <g fill="none" stroke="#8e8b95" stroke-width="1.4">
    <rect x="146" y="87" width="12" height="14" rx="3"/><path d="M152 87v14"/>
    <rect x="170" y="87" width="14" height="14" rx="3"/><path d="M177 91v6M174 94h6"/>
  </g>

  <!-- pinned tiles -->
  <rect x="12" y="114" width="38" height="38" rx="10" fill="#eceaf0"/>
  <text x="31" y="139" font-size="15" font-weight="600" fill="#8e8b95" text-anchor="middle">A</text>
  <rect x="56" y="114" width="38" height="38" rx="10" fill="#dce6f5" stroke="#6f5cf0" stroke-width="1.5"/>
  <text x="75" y="139" font-size="15" font-weight="600" fill="#3d86d6" text-anchor="middle">H</text>
  <rect x="100" y="114" width="38" height="38" rx="10" fill="#e5efe6"/>
  <text x="119" y="139" font-size="15" font-weight="600" fill="#4a9d63" text-anchor="middle">G</text>
  <rect x="144" y="114" width="38" height="38" rx="10" fill="#f6e8e4"/>
  <text x="163" y="139" font-size="15" font-weight="600" fill="#d9694a" text-anchor="middle">N</text>
  <path d="M8 168h172" stroke="#e4e1da"/>

  <!-- a folder, and its tabs -->
  <path d="M14 186l4 4-4 4" fill="none" stroke="#9c99a3" stroke-width="1.5" stroke-linecap="round"/>
  <text x="26" y="194" font-size="11" font-weight="600" fill="#6c6973">Getting Started</text>
  <text x="172" y="194" font-size="10" fill="#9c99a3" text-anchor="end">2</text>

  <rect x="14" y="204" width="164" height="24" rx="7" fill="#e8e3f9"/>
  <rect x="20" y="210" width="14" height="14" rx="4" fill="#dce6f5"/>
  <text x="27" y="220.5" font-size="8" font-weight="600" fill="#3d86d6" text-anchor="middle">H</text>
  <text x="40" y="220" font-size="11" fill="#2b2931">How-To Geek</text>

  <rect x="14" y="234" width="164" height="24" rx="7" fill="none"/>
  <circle cx="27" cy="246" r="6" fill="none" stroke="#b3a8f7" stroke-width="2"/>
  <circle cx="27" cy="246" r="6" fill="none" stroke="#6f5cf0" stroke-width="2" stroke-dasharray="9 30"/>
  <text x="40" y="250" font-size="11" fill="#3b3944">π - Arc-style browser theme</text>

  <!-- the foot -->
  <path d="M0 562h200" stroke="#e4e1da"/>
  <path d="M24 577h8M28 573v8" stroke="#8e8b95" stroke-width="1.5" stroke-linecap="round"/>
  <rect x="44" y="570" width="14" height="14" rx="3" fill="none" stroke="#8e8b95" stroke-width="1.4"/>
  <path d="M51 574v6M48 577h6" stroke="#8e8b95" stroke-width="1.4" stroke-linecap="round"/>
  <text x="120" y="581" font-size="9.5" fill="#9c99a3">amr</text>
  <g stroke="#8e8b95" stroke-width="1.4" fill="none" stroke-linecap="round">
    <path d="M172 570h10M176 570v-1.6h2.6V570M174 570l.6 9h5l.6-9M177 573v4M180 573v4"/>
  </g>

  <!-- the cards, a split's two -->
  <g filter="url(#card)">
    <rect x="212" y="80" width="352" height="440" rx="12" fill="#fff"/>
    <rect x="572" y="80" width="352" height="440" rx="12" fill="#fff"/>
  </g>

  <!-- the left card: a terminal -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9">
    <text x="224" y="100" fill="#9c99a3" font-size="8.5" font-family="-apple-system, sans-serif">π - Arc-style browser theme for pumi - pumi</text>
    <text x="224" y="126" fill="#2b2931">&gt; i want it basically almost 1:1 with arc okay</text>
    <text x="224" y="144" fill="#6c6973">Took 1.5s</text>
    <rect x="222" y="160" width="332" height="18" rx="4" fill="#f4f2f8"/>
    <text x="228" y="172" fill="#6f5cf0">$ bun test</text>
    <text x="224" y="198" fill="#3b3944">27 pass</text>
    <text x="224" y="212" fill="#3b3944">0 fail</text>
    <rect x="224" y="300" width="330" height="1" fill="#eeeae3"/>
    <text x="224" y="330" fill="#6c6973">~/Kitchen/pumi-all/pumi · deepseek</text>
  </g>

  <!-- the right card: a page, Arc's bar over its own toolbar and its address along its foot -->
  <path d="M572 80h352v32H572z" fill="#fff"/>
  <path d="M572 112h352" stroke="#f0ede8"/>
  <text x="584" y="101" fill="#9c99a3" font-size="8.5" font-family="-apple-system, sans-serif">How-To Geek - We Explain Technology</text>

  <rect x="572" y="112" width="352" height="368" fill="#101014"/>
  <rect x="596" y="140" width="304" height="120" rx="6" fill="#2f6f3f"/>
  <text x="610" y="160" fill="#c9f5cf" font-size="10" font-family="ui-monospace, Menlo, monospace">dibakar@CinnamonMint:~$ neofetch</text>
  <text x="610" y="176" fill="#a8d8b4" font-size="8" font-family="ui-monospace, Menlo, monospace">OS: Linux Mint 21.2</text>
  <text x="610" y="188" fill="#a8d8b4" font-size="8" font-family="ui-monospace, Menlo, monospace">Kernel: 6.1.8</text>
  <text x="610" y="200" fill="#a8d8b4" font-size="8" font-family="ui-monospace, Menlo, monospace">CPU: AMD Ryzen 5</text>
  <text x="596" y="292" fill="#f5f2ec" font-size="17" font-weight="700" font-family="-apple-system, sans-serif">I finally found a distro that</text>
  <text x="596" y="314" fill="#f5f2ec" font-size="17" font-weight="700" font-family="-apple-system, sans-serif">convinced me to quit Linux Mint</text>
  <text x="596" y="336" fill="#9c99a3" font-size="9" font-family="-apple-system, sans-serif">By Arol Wright</text>
  <rect x="596" y="352" width="144" height="70" rx="4" fill="#3c3c46"/>
  <rect x="752" y="352" width="144" height="70" rx="4" fill="#3c3c46"/>

  <path d="M572 480h352v20a12 12 0 0 1-12 12H584a12 12 0 0 1-12-12z" fill="#fff"/>
  <path d="M572 480h352" stroke="#f0ede8"/>
  <text x="584" y="494" fill="#9c99a3" font-size="8" font-family="-apple-system, sans-serif">howtogeek.com</text>

  <text x="480" y="566" fill="#a8a4ae" font-size="11" text-anchor="middle" font-family="-apple-system, sans-serif">pumi as Arc · amresyd/arc</text>
</svg>
