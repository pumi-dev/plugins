[package]
name = "marmaide"
version = "0.1.0"
edition = "2024"
publish = false
description = "Mermaid diagrams in a pane, drawn by Pele: a tool an agent explains things with."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
pumi-plugin = { workspace = true }
serde_json = { workspace = true }
# The diagram is rasterised in the plugin: the same resvg gpui paints SVG with, given the faces
# the package ships (`vendor/fonts`), which is the one thing the app's assets cannot give us.
image = { version = "=0.25.10", default-features = false, features = ["png"] }
resvg = { version = "=0.46.0", default-features = false }
smallvec = "1"
tiny-skia = "=0.11.4"
usvg = { version = "=0.46.0", default-features = false, features = ["text"] }
